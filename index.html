<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORM Prototype Engine</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', system-ui, sans-serif; }
      #app { position: relative; width: 100%; height: 100%; }
      canvas#gl { display: block; width: 100%; height: 100%; }
      canvas#hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; letter-spacing: 0.2em; background: #0a0a0f; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <div id="boot">LOADING STORM ENGINE…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
